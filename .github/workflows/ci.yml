name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code partagé (JVM/Android + JS), app Android, ktlint et tests.
  shared-android-web:
    name: Partagé, Android et JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation, lint et tests
        run: ./gradlew build

  # Cibles iOS : elles ne compilent que sur macOS.
  ios:
    name: Partagé iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests iOS (simulateur) et framework Shared
        run: ./gradlew iosSimulatorArm64Test :shared:umbrella:linkDebugFrameworkIosSimulatorArm64
